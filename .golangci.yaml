version: "2"

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - rowserrcheck
    - sqlclosecheck

  settings:
    depguard:
      rules:
        # plan.md §3.2: shared libraries must not depend on service-private code,
        # or the "libs/ splits out cleanly later" property is lost silently.
        libs-cannot-import-internal:
          files:
            - "**/libs/**"
          deny:
            - pkg: github.com/mservice/gitscanner/internal
              desc: "libs/ must not import internal/ (plan.md §3.2)"
            - pkg: github.com/mservice/gitscanner/cmd
              desc: "libs/ must not import cmd/ (plan.md §3.2)"

        # cmd/ only declares a service; wiring lives in internal/app and logic in
        # internal/<domain>. A driver import here means logic is leaking into
        # main, where it cannot be tested or reused.
        cmd-is-declaration-only:
          files:
            - "**/cmd/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: "use internal/store via app.Deps"
            - pkg: github.com/rabbitmq/amqp091-go
              desc: "use libs/rabbit via app.Deps"
            - pkg: github.com/redis/go-redis
              desc: "use libs/redis via app.Deps"

        # libs/entity is standard library only, so it never becomes the module
        # that drags a driver into every build.
        entity-is-stdlib-only:
          files:
            - "**/libs/entity/**"
          allow:
            - $gostd
            - github.com/mservice/gitscanner/libs/entity

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
