# One definition of "builds and passes" (plan.md §14.6): CI runs the same make
# targets a developer runs locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Built from source with the module's toolchain on purpose: prebuilt
      # golangci-lint releases are compiled with an older Go and refuse to lint
      # a module that targets a newer one.
      - name: Install tools
        run: make bootstrap

      - run: make vet
      - run: make lint
      - run: make test
      - run: make build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-integration

  proto:
    runs-on: ubuntu-latest
    # buf-action reports a lint, format or breaking-change finding by commenting
    # on the pull request. Without this it still fails the job, but the comment
    # call errors with "Resource not accessible by integration" and the finding
    # is only visible by opening the logs. Scoped to this job so the rest of the
    # workflow keeps the read-only default.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking compares against main
      - uses: bufbuild/buf-action@v1
        with:
          input: libs/proto
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main,subdir=libs/proto"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make chart-lint

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
