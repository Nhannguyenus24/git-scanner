{{- range $name, $svc := .Values.services }}
{{- if gt (int $svc.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitscanner.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  # maxUnavailable rather than minAvailable: with KEDA changing the replica
  # count constantly, a fixed minimum would block node drains whenever the
  # scaler happened to be at the floor.
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "gitscanner.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
